[project]
name = "heat-waves"
version = "0.1.0"
description = "Heat-wave prediction with ECMWF AIFS2 vs ERA5 (Sept 2022 California heat wave)"
requires-python = "==3.12.*"
dependencies = [
    # earth2studio from git main: only main has the AIFS2 model + [aifs2] extra
    # (PyPI 0.15.0 has aifs/aifsens only). aifs2 pulls anemoi-models 0.9.x,
    # earthkit-regrid, ecmwf-opendata, torch-geometric, flash-attn.
    "earth2studio[aifs2,data,aurora,sfno]",
    # Pin torch to the exact build the cached flash-attn wheel was made for
    # (rebuilt against torch 2.13.0+cu132). ABI mismatch => import crash.
    "torch==2.13.0",
    "flash-attn",
    "xarray>=2024.1.0",
    "zarr>=2.18.0",
    "netcdf4>=1.6.0",
    "h5netcdf>=1.3.0",
    "matplotlib>=3.8.1",
    "cartopy>=0.22.0",
    "numpy>=2.0",
    "tqdm>=4.60.0",
    "ninja>=1.13.0",
    "nvidia-ml-py",
    "cupy-cuda13x>=14.0.0",
    "cucim-cu13>=25.4.0",
    "pytest>=9.0.3",
    # nvidia-physicsnemo 2.0.0 (pulled by makani for SFNO) calls warp.context.Device, removed in
    # newer warp-lang; pin below the API break so physicsnemo imports cleanly.
    "warp-lang>=1.5,<1.13",
]

[dependency-groups]
dev = ["ipykernel>=7.1.0"]

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", branch = "main" }
torch = { index = "pytorch-cu132" }
# Reuse the prebuilt, ABI-matched flash-attn wheel instead of a multi-hour source build.
flash-attn = { path = "/home/jovyan/wheels/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
# torch-harmonics (pulled by makani for SFNO) compiles torch C++ extensions and needs torch
# importable at build time, so it must build without isolation against the installed torch.
no-build-isolation-package = ["flash-attn", "torch-harmonics"]
index-strategy = "unsafe-best-match"

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "packaging", "ninja"]
torch-harmonics = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
priority = "supplemental"
